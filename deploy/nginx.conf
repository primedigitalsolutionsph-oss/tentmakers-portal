# Nginx vhost for the Tentmakers portal.
# On the VPS: sudo cp deploy/nginx.conf /etc/nginx/sites-available/tentmakers
# then: sudo ln -s /etc/nginx/sites-available/tentmakers /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
server {
  listen 80;
  server_name tentmakers.primedigitalsolutions.ph;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }
}
